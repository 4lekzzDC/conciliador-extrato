<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Conciliação Financeira</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-[#0b0f17] text-gray-200 flex flex-col items-center justify-center font-[Inter]">

    <!-- HEADER CENTRALIZADO -->
    <header class="mb-12 text-center">
        <div class="flex items-center justify-center space-x-4">
            <img th:src="@{/img/logo-itamarathy.png}" alt="Logo Itamarathy" class="h-14 drop-shadow-md">
            <h1 class="text-4xl font-semibold tracking-wide text-white">Conciliação Financeira</h1>
        </div>
    </header>

    <!-- FORM PRINCIPAL -->
    <form th:action="@{/ui/processar}" method="post" enctype="multipart/form-data"
          class="w-full max-w-5xl bg-[#121826]/70 p-10 rounded-2xl shadow-lg border border-gray-700/50">

        <!-- BOXES DE UPLOAD LADO A LADO -->
        <div class="flex flex-col md:flex-row justify-center gap-8 mb-10">

            <!-- BOX RAZAO -->
            <div class="flex-1 p-8 border-2 border-dashed border-blue-400 rounded-2xl text-center cursor-pointer 
                        hover:border-blue-300 hover:bg-white/5 transition">
                <label for="razao" class="block text-lg font-semibold mb-3 text-blue-300">Arquivo Razão (.xlsx)</label>
                <input id="razao" name="razao" type="file" accept=".xlsx" required class="hidden">
                <p class="text-sm text-gray-400">Arraste e solte aqui ou clique para selecionar</p>
                <p id="razaoFileName" class="mt-3 text-sm text-gray-500">Nenhum arquivo selecionado</p>
            </div>

            <!-- BOX EXTRATO -->
            <div class="flex-1 p-8 border-2 border-dashed border-blue-400 rounded-2xl text-center cursor-pointer 
                        hover:border-blue-300 hover:bg-white/5 transition">
                <label for="extrato" class="block text-lg font-semibold mb-3 text-blue-300">Arquivo Extrato (.xlsx)</label>
                <input id="extrato" name="extrato" type="file" accept=".xlsx" required class="hidden">
                <p class="text-sm text-gray-400">Arraste e solte aqui ou clique para selecionar</p>
                <p id="extratoFileName" class="mt-3 text-sm text-gray-500">Nenhum arquivo selecionado</p>
            </div>

        </div>

        <!-- BOTÃO PROCESSAR -->
        <div class="flex justify-center">
            <button type="submit"
                    class="bg-blue-600 hover:bg-blue-500 text-white font-semibold py-3 px-10 rounded-full 
                           transition shadow-md hover:shadow-blue-600/40">
                Processar Conciliação
            </button>
        </div>
    </form>

    <footer class="mt-10 text-gray-500 text-sm">
        © <span th:text="${#dates.format(#dates.createNow(), 'yyyy')}"></span> Itamarathy Contabilidade
    </footer>

    <!-- SCRIPT: MOSTRAR NOME DO ARQUIVO -->
    <script>
        function bindFileInput(id) {
            const input = document.getElementById(id);
            const label = input.parentElement;
            const fileName = document.getElementById(id + 'FileName');

            label.addEventListener('click', () => input.click());
            input.addEventListener('change', () => {
                fileName.textContent = input.files.length > 0
                    ? input.files[0].name
                    : 'Nenhum arquivo selecionado';
            });
        }

        bindFileInput('razao');
        bindFileInput('extrato');
    </script>

</body>
</html>
