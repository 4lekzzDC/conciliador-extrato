<!-- templates/ui_result.html -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <title>Resultado da Conciliação</title>
  <link rel="stylesheet" th:href="@{/css/dark.css}"/>
</head>
<body style="background:var(--bg); color:var(--text);">
  <main style="max-width:1200px; margin:0 auto; padding:2rem 1rem;">

    <!-- Header e chips -->
    <header style="text-align:center; margin-bottom:1rem;">
      <h1>Resultado da Conciliação</h1>
      <div style="margin-top:1rem; display:flex; gap:.5rem; justify-content:center; flex-wrap:wrap;">
        <span class="chip">Conciliado</span>
        <span class="chip" style="background:rgba(239,68,68,.15); color:#fecaca;">Divergência</span>
        <span class="chip" style="background:rgba(234,179,8,.15); color:#fde68a;">Somente no Razão</span>
        <span class="chip" style="background:rgba(37,99,235,.15); color:#bfdbfe;">Somente no Extrato</span>
        <span class="chip">Razão: <b th:text="${#lists.size(resultado?.somenteNoRazao)}">0</b></span>
        <span class="chip">Extrato: <b th:text="${#lists.size(resultado?.somenteNoExtrato)}">0</b></span>
        <span class="chip">Divergências: <b th:text="${#lists.size(resultado?.divergencias)}">0</b></span>
      </div>
    </header>

    <!-- Controles de modo -->
    <section style="text-align:center; margin-bottom:1rem;" class="btn-group">
      <button class="btn" data-modo="duascolunas">Colunas</button>
      <button class="btn ghost" data-modo="abas">Abas</button>
      <button class="btn ghost" data-modo="comparativo">Comparativo</button>
      <a class="btn ghost" th:href="@{/ui}" style="margin-left:1rem;">Nova Conciliação</a>
    </section>

    <!-- Modo atual vindo do controller -->
    <input type="hidden" id="modoServidor" th:value="${modo}"/>

    <!-- =================== DUAS COLUNAS =================== -->
    <section id="view-duascolunas" style="display:none;">
      <div style="display:grid; grid-template-columns:1fr 1fr; gap:1rem;">
        <div th:replace="fragments/tabelas :: tabelaPadrao('Somente no Razão', ${resultado?.somenteNoRazao})"></div>
        <div th:replace="fragments/tabelas :: tabelaPadrao('Somente no Extrato', ${resultado?.somenteNoExtrato})"></div>
      </div>
      <div style="margin-top:1rem;"
           th:replace="fragments/tabelas :: tabelaDivergencias(${resultado?.divergencias})"></div>
    </section>

    <!-- =================== ABAS =================== -->
    <section id="view-abas" style="display:none;">
      <div class="card" style="padding:1rem;">
        <div style="display:flex; gap:.5rem; margin-bottom:.75rem;">
          <button class="btn tab-btn" data-tab="aba-razao">Razão</button>
          <button class="btn ghost tab-btn" data-tab="aba-extrato">Extrato</button>
          <button class="btn ghost tab-btn" data-tab="aba-div">Divergências</button>
        </div>
        <div id="aba-razao" class="tab-pane">
          <div th:replace="fragments/tabelas :: tabelaPadrao('Somente no Razão', ${resultado?.somenteNoRazao})"></div>
        </div>
        <div id="aba-extrato" class="tab-pane" style="display:none;">
          <div th:replace="fragments/tabelas :: tabelaPadrao('Somente no Extrato', ${resultado?.somenteNoExtrato})"></div>
        </div>
        <div id="aba-div" class="tab-pane" style="display:none;">
          <div th:replace="fragments/tabelas :: tabelaDivergencias(${resultado?.divergencias})"></div>
        </div>
      </div>
    </section>

    <!-- =================== COMPARATIVO =================== -->
    <section id="view-comparativo" style="display:none;">
      <div style="display:grid; grid-template-columns:1fr 1fr; gap:1rem;">
        <div th:replace="fragments/tabelas :: tabelaPadrao('Somente no Razão', ${resultado?.somenteNoRazao})"></div>
        <div th:replace="fragments/tabelas :: tabelaPadrao('Somente no Extrato', ${resultado?.somenteNoExtrato})"></div>
      </div>
      <div style="margin-top:1rem;"
           th:replace="fragments/tabelas :: tabelaDivergencias(${resultado?.divergencias})"></div>
    </section>

  </main>

  <script>
    // Seleção de modo (garante que Abas/Comparativo SEMPRE mostram os mesmos dados)
    (function(){
      const serverMode = (document.getElementById('modoServidor')?.value || 'duascolunas');
      const views = {
        duascolunas: document.getElementById('view-duascolunas'),
        abas:        document.getElementById('view-abas'),
        comparativo: document.getElementById('view-comparativo')
      };

      function setMode(m){
        for(const k in views){ views[k].style.display = (k===m) ? 'block' : 'none'; }
        // estiliza botões
        document.querySelectorAll('[data-modo]').forEach(b=>{
          if(b.dataset.modo===m){ b.classList.remove('ghost'); }
          else{ b.classList.add('ghost'); }
        });
      }

      setMode(serverMode);

      document.querySelectorAll('[data-modo]').forEach(btn=>{
        btn.addEventListener('click', ()=> setMode(btn.dataset.modo));
      });

      // tabs
      document.querySelectorAll('.tab-btn').forEach(btn=>{
        btn.addEventListener('click', ()=>{
          const tab = btn.dataset.tab;
          document.querySelectorAll('.tab-pane').forEach(p=>p.style.display='none');
          document.getElementById(tab).style.display = 'block';
          document.querySelectorAll('.tab-btn').forEach(b=>b.classList.add('ghost'));
          btn.classList.remove('ghost');
        });
      });
    })();
  </script>
</body>
</html>
