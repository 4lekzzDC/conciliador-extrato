<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Erro na Conciliação</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-[#0b0f17] text-gray-200 flex flex-col items-center justify-center font-[Inter]">
    <div class="bg-white/5 border border-red-500/40 rounded-2xl p-10 max-w-2xl text-center shadow-xl">
        <h1 class="text-3xl font-semibold text-red-400 mb-4">Erro ao Processar</h1>
        <p th:utext="${mensagem}" class="text-gray-300 leading-relaxed"></p>

        <a th:href="@{/ui}" class="mt-8 inline-block bg-blue-600 hover:bg-blue-500 text-white px-8 py-3 rounded-full transition">
            Voltar e Tentar Novamente
        </a>
    </div>

    <footer class="mt-10 text-gray-500 text-sm">
        © <span th:text="${#dates.format(#dates.createNow(), 'yyyy')}"></span> Itamarathy Contabilidade
    </footer>
</body>
</html>
